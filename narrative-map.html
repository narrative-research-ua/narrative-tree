<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта наративів</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    color: #15212b;
    background: #f5f6f8;
    font-family: Arial, sans-serif;
}
.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 18px;
    background: white;
    border-bottom: 1px solid #e1e4e8;
}
.hint { font-size: 14px; }
.controls {
    display: flex;
    align-items: center;
    gap: 8px;
}
button {
    font: inherit;
    cursor: pointer;
    border: 1px solid #d8dde3;
    background: white;
    color: #15212b;
    border-radius: 6px;
    padding: 7px 11px;
}
button:hover { background: #f0f2f5; }
button:focus-visible {
    outline: 2px solid #3b4b8c;
    outline-offset: 3px;
}
#zoom-value {
    min-width: 48px;
    text-align: center;
    font-size: 13px;
}
.viewport {
    height: calc(100dvh - 70px);
    overflow: auto;
    padding: 14px;
}
#chart {
    width: 100%;
    background: white;
}
.tile-hit { cursor: pointer; }
.tile-hit:focus { outline: none; }
.tile-hit:hover rect,
.tile-hit:focus-visible rect {
    stroke: white;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}
dialog {
    width: min(620px, calc(100vw - 32px));
    max-height: calc(100dvh - 40px);
    overflow: auto;
    border: 0;
    border-radius: 12px;
    padding: 26px;
    color: #15212b;
    box-shadow: 0 18px 70px #0003;
    font-family: Arial, sans-serif;
}
dialog::backdrop { background: #10192380; }
.dialog-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}
#detail-kind {
    color: #596572;
    font-size: 13px;
}
#detail-title {
    font-size: 22px;
    line-height: 1.35;
    margin: 18px 0;
    overflow-wrap: anywhere;
}
.counter {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 24px;
}
.grand-label {
    color: #596572;
    font-size: 12px;
    margin-bottom: 7px;
}
#detail-grand {
    font-size: 15px;
    line-height: 1.45;
}
@media (max-width: 600px) {
    .viewport { height: calc(100dvh - 110px); }
    #detail-title { font-size: 19px; }
}
</style>

        <style id="topics-style">
        .topics-section {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e1e4e8;
        }
        .topics-section h2 {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
        }
        #detail-topics {
            margin: 0;
            padding-left: 20px;
        }
        #detail-topics li {
            margin-bottom: 10px;
            padding-left: 3px;
            font-size: 15px;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }
        </style>
        
        <style id="hide-grand-details">
            .grand-label,
            #detail-grand {
                display: none;
            }
        </style>

    // Прибираємо лінії та порожні контури піктограм.
    const iconParts = [...svg.querySelectorAll(
        'g[id^="patch_"], g[id^="line2d_"]'
    )];

    for (const group of iconParts) {
        const isLine = group.id.startsWith("line2d_");

        const isOutline =
            group.id.startsWith("patch_") &&
            [...group.children].some(element => {
                const style = element.getAttribute("style") || "";
                return /(?:^|;)\s*fill\s*:\s*none(?:\s*;|\s*$)/i.test(style);
            });

        if (isLine || isOutline) {
            removeKeepingDefinitions(group);
        }
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", removeTileCounters);
} else {
    removeTileCounters();
}
</script>

</body>
</html>
