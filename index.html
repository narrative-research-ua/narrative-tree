"995.0\">Санкції Заходу проти Росії є незаконними і</tspan><tspan x=\"770\" y=\"1021.0\">передусім б&#x27;ють по європейських країнах, які</tspan><tspan x=\"770\" y=\"1047.0\">їх запровадили</tspan></text><circle cx=\"1245\" cy=\"1021.0\" r=\"4\" fill=\"#D45858\"/><polyline points=\"1245,1021.0 1330,1021.0\" fill=\"none\" stroke=\"#D45858\" stroke-width=\"1.6\"/></g><g data-kind=\"narrative\"><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1175.0\">Російська позиція щодо глобальної продовольчої кризи</tspan><tspan x=\"590\" y=\"1201.0\">та експорту зерна</tspan></text><circle cx=\"615\" cy=\"1188.0\" r=\"4\" fill=\"#3988B8\"/><polyline points=\"615,1188.0 690,1188.0\" fill=\"none\" stroke=\"#3988B8\" stroke-width=\"1.6\"/><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1251.0\">Заяви про міжнародні угоди та обмеження, пов&#x27;язані з</tspan><tspan x=\"590\" y=\"1277.0\">Росією</tspan></text><circle cx=\"615\" cy=\"1264.0\" r=\"4\" fill=\"#3988B8\"/><polyline points=\"615,1264.0 690,1264.0\" fill=\"none\" stroke=\"#3988B8\" stroke-width=\"1.6\"/><polyline points=\"690,1188.0 690,1264.0\" fill=\"none\" stroke=\"#3988B8\" stroke-width=\"1.4\"/><polyline points=\"690,1226.0 745,1226.0\" fill=\"none\" stroke=\"#3988B8\" stroke-width=\"1.6\"/><text text-anchor=\"start\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"770\" y=\"1213.0\">Захід створює глобальну продовольчу кризу,</tspan><tspan x=\"770\" y=\"1239.0\">а Росія забезпечує нужденні країни зерном</tspan></text><circle cx=\"1245\" cy=\"1226.0\" r=\"4\" fill=\"#3988B8\"/><polyline points=\"1245,1226.0 1330,1226.0\" fill=\"none\" stroke=\"#3988B8\" stroke-width=\"1.6\"/></g><g data-kind=\"narrative\"><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1355.0\">Російсько-британські відносини та критика британськ .0\" fill=\"none\" stroke=\"#DA9B38\" stroke-width=\"1.6\"/><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1687.0\">Критика західних атак на цивільне населення та</tspan><tspan x=\"590\" y=\"1713.0\">подвійні стандарти США у гуманітарних питаннях</tspan></text><circle cx=\"615\" cy=\"1700.0\" r=\"4\" fill=\"#DA9B38\"/><polyline points=\"615,1700.0 690,1700.0\" fill=\"none\" stroke=\"#DA9B38\" stroke-width=\"1.6\"/><polyline points=\"690,1472.0 690,1700.0\" fill=\"none\" stroke=\"#DA9B38\" stroke-width=\"1.4\"/><polyline points=\"690,1586.0 745,1586.0\" fill=\"none\" stroke=\"#DA9B38\" stroke-width=\"1.6\"/><text text-anchor=\"start\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"770\" y=\"1560.0\">Захід втручається у справи суверенних</tspan><tspan x=\"770\" y=\"1586.0\">держав, провокує війни та гуманітарні</tspan><tspan x=\"770\" y=\"1612.0\">катастрофи, залишаючись непокараним</tspan></text><circle cx=\"1245\" cy=\"1586.0\" r=\"4\" fill=\"#DA9B38\"/><polyline points=\"1245,1586.0 1330,1586.0\" fill=\"none\" stroke=\"#DA9B38\" stroke-width=\"1.6\"/></g><g data-kind=\"narrative\"><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1791.0\">Російські звинувачення щодо американських біологічних</tspan><tspan x=\"590\" y=\"1817.0\">програм в Україні</tspan></text><circle cx=\"615\" cy=\"1804.0\" r=\"4\" fill=\"#468EC1\"/><polyline points=\"615,1804.0 690,1804.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.6\"/><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1867.0\">Кампанія проти постачання боєприпасів зі збідненим</tspan><tspan x=\"590\" y=\"1893.0\">ураном як екологічної та медичної загрози</tspan></text><circle cx=\"615\" cy=\"1880.0\" r=\"4\" fill=\"#468EC1\"/><polyline points=\"615,1880.0 690,1880.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.6\"/><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1943.0\">Ядерна доктрина та стратегічні озброєння Росії</tspan></text><circle cx=\"615\" cy=\"1943.0\" r=\"4\" fill=\"#468EC1\"/><polyline points=\"615,1943.0 690,1943.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.6\"/><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"1993.0\">Захист від звинувачень у використанні хімічної зброї та</tspan><tspan x=\"590\" y=\"2019.0\">дискредитація західної критики</tspan></text><circle cx=\"615\" cy=\"2006.0\" r=\"4\" fill=\"#468EC1\"/><polyline points=\"615,2006.0 690,2006.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.6\"/><polyline points=\"690,1804.0 690,2006.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.4\"/><polyline points=\"690,1905.0 745,1905.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.6\"/><text text-anchor=\"start\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"770\" y=\"1879.0\">Захід перетворює Україну на полігон для зброї</tspan><tspan x=\"770\" y=\"1905.0\">масового ураження й штовхає світ до</tspan><tspan x=\"770\" y=\"1931.0\">катастрофи, а Росія лише стримує загрозу</tspan></text><circle cx=\"1245\" cy=\"1905.0\" r=\"4\" fill=\"#468EC1\"/><polyline points=\"1245,1905.0 1330,1905.0\" fill=\"none\" stroke=\"#468EC1\" stroke-width=\"1.6\"/></g><g data-kind=\"narrative\"><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"2097.0\">Дипломатичні заяви та інциденти Посольства Росії в</tspan><tspan x=\"590\" y=\"2123.0\">скандинавських державах</tspan></text><circle cx=\"615\" cy=\"2110.0\" r=\"4\" fill=\"#4DA59A\"/><polyline points=\"615,2110.0 690,2110.0\" fill=\"none\" stroke=\"#4DA59A\" stroke-width=\"1.6\"/><text text-anchor=\"end\" dominant-baseline=\"middle\" font-size=\"18\" fill=\"#28303B\"><tspan x=\"590\" y=\"2173.0\">К
